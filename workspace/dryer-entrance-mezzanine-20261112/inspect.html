<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><base href="/apps/site/"><title>출입구·1층·1.5층·3층 영상 대조</title><link rel="icon" href="/workspace/icon.svg"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce2dc}canvas{width:100%;height:100%;display:block}output{position:absolute;left:12px;top:12px;background:#fffffff0;padding:9px 12px;border-radius:6px;font:14px/1.5 sans-serif;max-width:70vw}</style></head><body><canvas id="review"></canvas><output id="caption">영상 동선 모델 검토</output><script type="module">
import * as THREE from '/apps/shared/vendor/three.module.js';
import { createFacilityScene } from '/apps/site/scene.js';
import { EQUIPMENT } from '/apps/site/building-data.js';
const canvas=document.getElementById('review');
const scene=createFacilityScene(canvas,{equipment:EQUIPMENT,floor:2,areas:['dryer']});
window.reviewScene=scene;window.THREE=THREE;
window.inspectPoint=(point,eye,caption='')=>{
  scene.setActive(false);const camera=new THREE.PerspectiveCamera(48,canvas.clientWidth/canvas.clientHeight,.02,2000);
  camera.position.set(...eye);camera.lookAt(...point);camera.updateMatrixWorld(true);scene.scene.updateMatrixWorld(true);
  scene.renderer.render(scene.scene,camera);document.getElementById('caption').textContent=caption;
};
window.inspectFloor=(level,point,eye,caption)=>{scene.setFloor(level);scene.setView('perspective');inspectPoint(point,eye,caption);};
window.inspectFloor(2,[17,4.4,18.4],[32,10.5,31],'1.5층 · 탈의실과 생산 관찰 통로');
window.reviewReady=true;
</script></body></html>
