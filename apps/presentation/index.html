<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#153d64">
  <meta name="description" content="1층부터 옥상까지 희창유업 건조기 층별 공간과 주요 설비를 살펴봅니다.">
  <title>희창유업 · 건조기 시연</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../site/furnace-detail.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body class="presentation-page" data-status="loading">
  <main class="presentation-app" aria-label="희창유업 건조기 시연">
    <header class="presentation-header">
      <div class="presentation-brand">
        <span class="company-logo"><img src="../site/assets/branding/company-logo.jpg" alt="희창유업"></span>
        <span class="brand-divider" aria-hidden="true"></span>
        <div><p>HEECHANG · DRYER</p><strong>건조기 현장 시연</strong></div>
      </div>
      <div class="presentation-status"><span class="status-dot" aria-hidden="true"></span><span data-status-label>시연 준비 중</span></div>
    </header>

    <section class="presentation-stage" aria-label="건조기 층별 사람 시점">
      <canvas id="presentation-canvas" aria-label="건조기를 사람의 눈높이로 따라가는 자동 시연 화면"></canvas>
      <div class="stage-shade" aria-hidden="true"></div>
      <div class="scene-location"><span class="location-dot" aria-hidden="true"></span><strong data-location>1층</strong><span data-view-label>사람 시점</span></div>
      <div id="scene-transition" class="scene-transition" aria-hidden="true"></div>

      <div class="presentation-copy">
        <p class="scene-eyebrow" data-scene-eyebrow>건조기 시연 · 시작점</p>
        <h1 data-scene-title>1층 · 조제·충전·외포장</h1>
        <p class="scene-caption" data-scene-caption>건조기의 층별 공간과 주요 설비</p>
      </div>

      <aside class="presentation-guide" aria-label="희창유업 현장 안내자">
        <span class="guide-greeting" data-guide-greeting>함께 올라가 볼까요</span>
        <div class="guide-portrait" aria-hidden="true">
          <svg viewBox="0 0 160 190" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="80" cy="184" rx="65" ry="6" fill="#153D64" fill-opacity=".13"/>
            <path d="M20 187v-38c0-25 22-36 60-36s60 11 60 36v38H20Z" fill="#174C78"/>
            <path d="M58 113h44l12 24-34 20-34-20 12-24Z" fill="#F8FBFC"/>
            <path d="M65 97h30v26c-7 9-23 9-30 0V97Z" fill="#E8AA81"/>
            <path d="M45 53c0-23 15-37 35-37s35 14 35 37v26c0 24-17 38-35 38S45 103 45 79V53Z" fill="#F2C39F"/>
            <ellipse cx="43" cy="76" rx="6" ry="10" fill="#EFB78F"/><ellipse cx="117" cy="76" rx="6" ry="10" fill="#EFB78F"/>
            <path d="M49 56v17l-7-8V48h75v17l-7 8V55l-16-8H61l-12 9Z" fill="#293644"/>
            <path d="M45 44c0-23 13-37 35-37s35 14 35 37v10H45V44Z" fill="#FFFFFF" stroke="#CDD9E1" stroke-width="2"/>
            <path d="M80 8v23M52 19l-3 20M108 19l3 20" stroke="#D9E3E9" stroke-width="4" stroke-linecap="round"/>
            <path d="M37 49c0-4 3-7 7-7h72c4 0 7 3 7 7v7H37v-7Z" fill="#F6FAFC" stroke="#CFDCE5" stroke-width="2"/>
            <path d="M58 71c4-3 9-3 13-1M89 70c4-2 9-2 13 1" stroke="#514132" stroke-width="2.4" stroke-linecap="round"/>
            <ellipse cx="65" cy="78" rx="2.6" ry="3.3" fill="#253645"/><ellipse cx="95" cy="78" rx="2.6" ry="3.3" fill="#253645"/>
            <path d="M79 80l-3 10h6" stroke="#D79470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M70 97c6 5 14 5 20 0" stroke="#A05C45" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M46 124l-4 63M114 124l4 63M80 156v31" stroke="#87B1CA" stroke-width="2"/>
            <path d="M24 146l16 5M120 151l16-5" stroke="#5C8FB1" stroke-width="8"/>
            <path d="M46 162h25v21H46v-21Z" fill="#1D5A88" stroke="#77A0BB"/>
            <path d="M45 162h27l-4 8H49l-4-8Z" fill="#286A98"/>
          </svg>
          <span class="guide-logo guide-helmet-logo"><img src="../site/assets/branding/company-logo.jpg" alt=""></span>
          <span class="guide-logo guide-chest-logo"><img src="../site/assets/branding/company-logo.jpg" alt=""></span>
        </div>
        <span class="guide-name">희창유업 <b>현장 가이드</b></span>
      </aside>

      <div id="presentation-loading" class="presentation-loading" role="status"><span></span><strong>건조기 현장을 준비하고 있습니다</strong></div>
      <div id="presentation-error" class="presentation-error" role="alert" hidden><strong>시연 화면을 열지 못했습니다</strong><p>새로고침한 뒤 다시 시작해 주세요.</p><button type="button" data-action="reload">새로고침</button></div>
    </section>

    <footer class="presentation-footer">
      <section id="presentation-inspector" class="presentation-inspector" aria-label="건조기 도면과 직접 둘러보기" hidden>
        <strong class="inspection-heading" title="D · 도면 보기 / 시연 이어보기">도면·직접 보기</strong>
        <div class="inspection-floors" role="group" aria-label="건조기 층 선택"><button type="button" data-inspection-floor="1">1층</button><button type="button" data-inspection-floor="2">1.5층</button><button type="button" data-inspection-floor="3">3층</button><button type="button" data-inspection-floor="4">4층</button><button type="button" data-inspection-floor="5">5층</button><button type="button" data-inspection-floor="6">6층</button><button type="button" data-inspection-floor="7" aria-pressed="true">7층</button><button type="button" data-inspection-floor="8">옥상</button></div>
        <div class="inspection-views" role="group" aria-label="건조기 관찰 시점"><button type="button" data-inspection-view="perspective" aria-pressed="true">입체</button><button type="button" data-inspection-view="top" aria-pressed="false">평면</button><button type="button" data-inspection-reset aria-label="현재 층 시점 초기화" title="시점 초기화"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>초기화</span></button><button type="button" data-inspection-all aria-pressed="false" aria-label="건조기 전체 보기">전체</button></div>
        <button type="button" class="inspection-resume" data-action="resume" title="D · 시연 이어보기"><span aria-hidden="true">▶</span><span data-inspection-resume-label>시연 이어보기</span></button>
      </section>
      <nav class="tour-route" id="tour-route" aria-label="건조기 시연 순서"></nav>
      <div class="tour-controls" data-controls>
        <div class="transport-controls">
          <button type="button" class="transport-button" data-action="previous" aria-label="이전 장면" title="이전 장면 · ←"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14m11-13-9 6 9 6V6Z"/></svg></button>
          <button type="button" class="play-button" data-action="play" disabled><span class="play-glyph" aria-hidden="true">▶</span><span data-play-label>시연 준비 중</span></button>
          <button type="button" class="transport-button" data-action="next" aria-label="다음 장면" title="다음 장면 · →"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M6 6l9 6-9 6V6Z"/></svg></button>
        </div>
        <div class="playback-summary"><strong data-playback-label>준비 중</strong><span><span data-elapsed>0:00</span><span class="time-divider">/</span><span data-duration>0:00</span></span></div>
        <label class="playback-rate-control"><span>배속</span><select data-playback-rate aria-label="시연 배속"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option></select></label>
        <div class="utility-controls"><button type="button" data-action="restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>처음부터</span></button><button type="button" data-action="fullscreen" aria-label="전체 화면" title="전체 화면 / Esc · 종료 / Space · 재생·정지 / D · 도면 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></svg><span data-fullscreen-label>전체 화면</span></button></div>
      </div>
      <div class="tour-timeline" role="progressbar" aria-label="전체 시연 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span data-total-progress></span></div>
    </footer>
  </main>
  <div class="presentation-toast" id="presentation-toast" role="status" hidden></div>
  <noscript><p class="no-script">건조기 시연을 보려면 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>
