<script>
'use strict';
const data=JSON.parse(document.getElementById('dataset').textContent);
const groups=data.groups,teams=data.teams;
const get=id=>document.getElementById(id);
const fileCount=g=>new Set(g.rows.map(r=>r.file)).size;
let team='',selected='',visible=[];
const label=(tag,str,cls='')=>{const v=document.createElement(tag);if(cls)v.className=cls;v.textContent=str;return v};
const clean=s=>String(s||'').toLocaleLowerCase().replace(/[\s_·#./()-]/g,'');
const url=s=>'./'+s.split('/').map(encodeURIComponent).join('/');
get('headline').textContent='사진 '+data.n.toLocaleString('ko-KR')+'개 파일 · 4면 카드 '+Object.values(data.coverage).reduce((a,b)=>a+b,0)+'건';
function buttons(){
 const p=get('teams');p.replaceChildren();
 for(const t of ['',...teams]){const b=label('button',t||'전체');b.type='button';b.setAttribute('aria-pressed',String(t===team));b.onclick=()=>{team=t;selected='';buttons();list(true)};p.append(b)}
}
function show(g){
 const el=get('detail');el.replaceChildren();if(!g){el.append(label('p','해당하는 설비가 없습니다.','empty'));return}
 el.append(label('p',g.team+(g.cat?'  /  '+g.cat:''),'context'),label('h2',g.name));
 el.append(label('p',[g.card,g.loc,fileCount(g)+'개 파일'].filter(Boolean).join('  ·  '),'meta'));
 if(g.alert)el.append(label('p',g.alert,'notice'));
 const sections=new Map();for(const r of g.rows){if(r.side)continue;if(!sections.has(r.section))sections.set(r.section,[]);sections.get(r.section).push(r)}
 for(const [section,rows] of sections){
  el.append(label('h3',section+'  ('+rows.length+')'));const grid=label('div','','grid');
  for(const r of rows){
   const wide=r.section.startsWith('기존')&&(g.team===teams[0]||g.team===teams[1]||r.file.endsWith('/01_대표사진.jpg'));
   const c=label('section','',wide?'card wide':'card'),a=label('a','','photo');a.href=url(r.file);a.target='_blank';a.rel='noopener';a.title='사진 원본 크기로 열기';
   const im=document.createElement('img');im.src=url(r.file);im.alt=r.role;im.loading='lazy';im.decoding='async';a.append(im);
   const cap=label('div','','caption');cap.append(label('strong',r.role));if(r.match)cap.append(label('small',r.match));
   const views=g.rows.filter(view=>view.side&&view.file===r.file);
   if(views.length){const bar=label('div','','panel-links');for(const view of views){const link=label('a',view.role.replace(/^기존 /,''));link.href='?card='+encodeURIComponent(g.id)+'&view='+encodeURIComponent(view.side);link.target='_blank';link.rel='noopener';bar.append(link)}cap.append(bar)}
   const det=label('details','');det.append(label('summary','출처와 대조 근거'));if(r.note)det.append(label('p',r.note));det.append(label('p',r.source));cap.append(det);c.append(a,cap);grid.append(c)
  }el.append(grid)
 }
 if(!g.rows.length)el.append(label('p','이 카드와 연결할 수 있는 사진을 찾지 못했습니다.','empty'));
}
function select(id){
 selected=id;for(const b of get('items').children)b.setAttribute('aria-current',String(b.dataset.id===selected));show(visible.find(g=>g.id===id))
}
function list(reset){
 const q=clean(get('query').value);visible=groups.filter(g=>(!team||g.team===team)&&(!q||g.terms.includes(q)));
 const box=get('items');box.replaceChildren();get('count').textContent=(team||'전체')+' · 설비 및 자료 묶음 '+visible.length+'건';
 for(const g of visible){
  const b=label('button','');b.type='button';b.dataset.id=g.id;b.append(label('strong',g.name),label('span',[g.team,g.card||g.cat||g.loc,fileCount(g)+'개'].filter(Boolean).join(' · '),'mini'));b.onclick=()=>select(g.id);box.append(b)
 }
 if(reset)box.scrollTop=0;select(visible.some(g=>g.id===selected)?selected:(visible[0]||{}).id||'');
}
function showFace(g,view){
 const index=['front','left','right','rear'].indexOf(view.side);
 const page=label('main','','face-page'),back=label('a','설비 사진첩으로 돌아가기');
 back.href='?card='+encodeURIComponent(g.id);
 const title=g.name+' · '+view.role.replace(/^기존 /,'');document.title=title;
 const crop=label('div','','face-crop'),im=label('img','');im.src=url(view.file);im.alt=title;
 im.style.transform='translateX('+(-25*index)+'%)';crop.append(im);
 const original=label('a','4면 합본 JPG 열기');original.href=url(view.file);
 page.append(back,label('h1',title),label('p',g.team+' · '+g.card),crop,original,label('p',view.source));
 document.body.replaceChildren(page);
}
const query=new URLSearchParams(location.search),target=groups.find(g=>g.id===query.get('card'));
const face=target?.rows.find(row=>row.side&&row.side===query.get('view'));
if(face){showFace(target,face)}else{
 get('query').addEventListener('input',()=>list(true));
 if(target)selected=target.id;
 buttons();list(true);
}
</script></html>
