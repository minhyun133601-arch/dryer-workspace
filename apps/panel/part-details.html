<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123f3a" />
    <title>부품 상세 — 설비 한눈에</title>
    <link rel="stylesheet" href="styles/components/popout.css" />
  </head>
  <body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h6" /></symbol>
        <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 10V6l2-3h14l2 3v4M4 11v10h16V11M9 21v-7h6v7M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0" /></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-11 11M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2" /><path d="M16 8V3H3v13h5" /></symbol>
        <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8" cy="9" r="1" /><path d="m3 17 5-5 4 4 4-6 5 7" /></symbol>
        <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 8V3h12v5M6 17H3V8h18v9h-3M6 13h12v8H6zM17 11h1" /></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="m8 3 8 0-1 6 4 5H5l4-5-1-6ZM12 14v8" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      </defs>
    </svg>
    <header class="viewer-toolbar">
      <div class="viewer-brand"><span class="brand-mark">▤</span><span>설비 한눈에<small>부품 상세 창</small></span></div>
      <div class="toolbar-actions" aria-label="상세 창 표시 도구">
        <button type="button" id="followSelection" class="tool-button follow-button" aria-pressed="true"><svg class="icon"><use href="#i-pin" /></svg><span>선택 따라가기</span></button>
        <div class="type-controls" role="group" aria-label="글자 크기">
          <button type="button" id="smallerText" aria-label="글자 작게">A−</button>
          <button type="button" id="resetText" title="기본 글자 크기로">100%</button>
          <button type="button" id="largerText" aria-label="글자 크게">A+</button>
        </div>
        <button type="button" id="printPart" class="tool-button"><svg class="icon"><use href="#i-print" /></svg><span>인쇄</span></button>
      </div>
    </header>
    <div class="window-hint" id="followHint">이 창을 다른 모니터로 옮겨 부품맵과 함께 볼 수 있습니다.</div>
    <main id="partDetails" tabindex="-1"><p class="loading-copy">부품 정보를 불러오는 중입니다.</p></main>
    <div class="viewer-status" id="viewerStatus" role="status" aria-live="polite"></div>
    <dialog class="photo-dialog" id="largePhotoDialog">
      <div class="photo-dialog-heading"><strong id="largePhotoTitle">실물 참고 사진</strong><button type="button" id="closeLargePhoto" class="tool-button" aria-label="사진 닫기"><svg class="icon"><use href="#i-close" /></svg></button></div>
      <img id="largePhotoImage" alt="선택한 부품이 포함된 실물 사진" />
    </dialog>
    <script src="scripts/core/namespace.js"></script>
    <script src="scripts/core/config.js"></script>
    <script src="scripts/core/utils.js"></script>
    <script src="scripts/reference-images.js"></script>
    <script src="scripts/data/parts-plc.js"></script>
    <script src="scripts/data/parts-upper.js"></script>
    <script src="scripts/data/parts-middle.js"></script>
    <script src="scripts/data/parts-lower.js"></script>
    <script src="scripts/parts.js"></script>
    <script src="scripts/services/storage.js"></script>
    <script src="scripts/state/parts-store.js"></script>
    <script src="scripts/views/resource-view.js"></script>
    <script src="scripts/views/popout-view.js"></script>
  </body>
</html>
