<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="/apps/site/"><title>보행·출입문 검증</title><link rel="icon" href="/workspace/icon.svg"><style>html,body,main{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}output{position:absolute;top:8px;left:8px;background:white;padding:8px}</style></head><body><main><canvas id="review" tabindex="0"></canvas><output id="state"></output></main><script type="module">
import {createFacilityScene} from '/apps/site/scene.js';
import {CAMPUS_EQUIPMENT} from '/apps/site/campus-data.js';
import {PACKAGING_EQUIPMENT} from '/apps/site/packaging-data.js';
import {createPersonState} from '/apps/site/person-walk.js';
const scene=createFacilityScene(document.getElementById('review'),{equipment:[...CAMPUS_EQUIPMENT,...PACKAGING_EQUIPMENT],floor:'campus',enabledAreas:['campus','packaging'],onDoorInteraction:value=>{document.getElementById('state').textContent=JSON.stringify(value);}});
window.walkScene=scene;
window.placeAtTeam2=()=>{scene.setFloor('campus');scene.setView('person');scene.person=createPersonState({position:[9.525,.055,-65.85],yaw:Math.PI/2});scene.personArea='campus:';scene.personEyeY=null;scene._updatePersonCamera();scene._updateProximityDoors(0);scene._draw();document.getElementById('review').focus();};
window.placeAtTeam2();
</script></body></html>
