<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="/apps/site/"><title>입구 동선 모델 검토</title><style>html,body,main{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head><body><main><canvas id="review"></canvas></main><script type="module">
import {createFacilityScene} from '/apps/site/scene.js';
import {CAMPUS_EQUIPMENT} from '/apps/site/campus-data.js';
const scene=createFacilityScene(document.getElementById('review'),{equipment:CAMPUS_EQUIPMENT,floor:'campus',enabledAreas:['campus'],personEnabled:false});
window.reviewScene=scene;
window.reviewView=(target,azimuth,elevation,distance)=>{scene.setView('perspective');scene.target.set(...target);scene.goalTarget.copy(scene.target);Object.assign(scene.orbit,{azimuth,elevation,distance});Object.assign(scene.goalOrbit,scene.orbit);scene._updateCamera();scene._draw();};
window.reviewView([66.8,1.7,-33],1.6,.12,12);
</script></body></html>
